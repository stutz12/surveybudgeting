<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budgeting Survey</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 60px 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: #111827;
        }

        p {
            margin: 0 0 24px 0;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        iframe {
            width: 100%;
            border: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Thank you for taking the time to complete this survey</h1>
        <p>Your responses help us improve the budgeting experience. It should take &lt;5 minutes.</p>

        <iframe
            data-tally-src="https://tally.so/embed/pbXO1B?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1"
            loading="lazy"
            width="100%"
            height="1594"
            frameborder="0"
            marginheight="0"
            marginwidth="0"
            title="Budgeting Survey">
        </iframe>
    </div>

    <script>
        var d = document,
            w = "https://tally.so/widgets/embed.js",
            v = function () {
                if (typeof Tally !== "undefined") {
                    Tally.loadEmbeds();
                } else {
                    d.querySelectorAll("iframe[data-tally-src]:not([src])")
                        .forEach(function (e) {
                            e.src = e.dataset.tallySrc;
                        });
                }
            };

        if (typeof Tally !== "undefined") {
            v();
        } else if (d.querySelector('script[src="' + w + '"]') == null) {
            var s = d.createElement("script");
            s.src = w;
            s.onload = v;
            s.onerror = v;
            d.body.appendChild(s);
        }
    </script>

</body>
</html>
